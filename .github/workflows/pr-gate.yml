# Event-driven gate: recomputes the verdict on each CI completion event and
# publishes it as the `gate` commit status, the ONE required check to configure
# in branch protection. Adding, renaming, or removing a CI job then never needs
# a branch-protection edit again.
name: PR Gate

on:
  # First verdict on a new commit. A commit with no other jobs at all passes
  # once warmup-delay is up.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    # completed recomputes when a workflow finishes. in_progress clears a stale
    # red the moment someone re-runs a failed job.
    types: [in_progress, completed]
    # Every workflow, so adding one never means editing this file. Covers
    # Actions only; fires only once this file is on the default branch, so
    # merge it before requiring `gate` in the ruleset.
    workflows: ["**"]

# Serializes per commit so two events cannot race the same status context.
# cancel-in-progress would drop a terminal verdict and leave the PR pending.
concurrency:
  group: pr-gate-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Do not re-trigger on your own completion. workflow_run fires for this
    # workflow too, and GitHub chains it three levels deep before stopping.
    if: github.event.workflow_run.path != '.github/workflows/pr-gate.yml'
    permissions:
      contents: read
      checks: read
      statuses: write
      actions: read
    steps:
      - uses: muratkeremozcan/pr-gate@28ca8c246535c5e66959554a806d397df5747234 # main @ 2026-08-10
        with:
          mode: watch
          publish: status
