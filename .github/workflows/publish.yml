# Publishes eval-quality to npmjs.org.
# Triggered manually: Actions > Publish Package > Run workflow > pick version type.
# Bumps version, builds, publishes, tags, and opens a PR back to main.
#
# Uses npm trusted publishing (OIDC), not a static NPM_TOKEN secret: npm 11.5.1+ exchanges this job's
# GitHub Actions OIDC token for a short-lived publish credential automatically, so there is no
# long-lived npm token sitting in repo secrets for a compromised workflow or dependency to exfiltrate,
# and `npm publish --provenance` attaches a verifiable build-provenance attestation to the release.
# One-time setup this workflow cannot do for you: on npmjs.org, package Settings > Publishing access >
# add this exact repo (bmad-code-org/bmad-eval-quality) and this exact workflow file (publish.yml) as
# a Trusted Publisher. Until that link exists, `npm publish` below fails with an auth error - which is
# a safe failure mode, since the AD-18 guard already blocks every run before this point regardless.

name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump'
        required: true
        default: 'patch'
        type: 'choice'
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (if version_type is "custom")'
        required: false
        type: 'string'

env:
  NPM_VERSION: "11.18.0"

permissions:
  contents: write      # checkout + push branch/tag
  pull-requests: write # create PR
  id-token: write      # OIDC token for npm trusted publishing

jobs:
  build-and-publish:
    # Both conditions are defense in depth, neither is the AD-18 guard (the first step below is):
    # github.ref restricts this to the branch releases are cut from, github.repository stops a fork's
    # workflow_dispatch (forks can dispatch workflows present in their own copy) from ever reaching a
    # step that references this repo's secrets/OIDC trust relationship.
    if: github.ref == 'refs/heads/main' && github.repository == 'bmad-code-org/bmad-eval-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # AD-18: publication is blocked by a mechanism, not policy prose. `workflow_dispatch` alone is
      # not the guard - anyone with dispatch access could otherwise trigger a real publish. This step
      # is the guard: it fails before any other step until the repository variable below is set,
      # which happens only once the work-related intellectual-property question is resolved in
      # writing.
      - name: Publication guard (AD-18)
        run: |
          if [ "${{ vars.PUBLICATION_UNBLOCKED }}" != "true" ]; then
            echo "Publication is blocked: the AD-18 intellectual-property question is not yet resolved in writing." >&2
            echo "Set the repository variable PUBLICATION_UNBLOCKED=true once it is, then re-run this workflow." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - uses: ./.github/actions/audit-lockfile-age

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate inputs
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          if [[ "$VERSION_TYPE" == "custom" && -z "$CUSTOM_VERSION" ]]; then
            echo "ERROR: custom_version must be provided when version_type=custom"
            exit 1
          fi

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate version
        id: version
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          CURRENT_VERSION=$(npm pkg get version | tr -d '"')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION_TYPE" == "custom" ]]; then
            NEW_VERSION="$CUSTOM_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            PATCH_BASE="${PATCH%%-*}"
            if [[ "$VERSION_TYPE" == "major" ]]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [[ "$VERSION_TYPE" == "minor" ]]; then
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
            else
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH_BASE + 1))"
            fi
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version is already $NEW_VERSION, nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          npm version "$NEW_VERSION" --no-git-tag-version
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release_branch=release/v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build package
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Publish to npmjs.org
        if: steps.version.outputs.skip != 'true'
        # --provenance requires the id-token: write permission (granted above) and a public package;
        # no NODE_AUTH_TOKEN - trusted publishing exchanges this job's OIDC token for a short-lived
        # npm credential automatically once the registry-side Trusted Publisher link exists (see the
        # top-of-file comment).
        run: npm publish --access public --provenance
        env:
          # Only this step sets this; prepublishOnly (scripts/assert-publish-authorized.mjs) raises
          # the bar against a token-holder running `npm publish` from a laptop, but it is a speed bump,
          # not a credential boundary - `npm publish --ignore-scripts` skips prepublishOnly outright.
          # Trusted publishing is the actual credential-level control: nobody holds a long-lived npm
          # token to begin with, on a laptop or otherwise.
          EVAL_QUALITY_PUBLISH_AUTHORIZED: 'true'

      - name: Verify publish
        if: steps.version.outputs.skip != 'true'
        run: |
          sleep 5
          npm view eval-quality@${{ steps.version.outputs.new_version }} version && echo "Verified on npmjs.org"

      - name: Create commit, tag, and release branch
        if: steps.version.outputs.skip != 'true'
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release ${{ steps.version.outputs.new_version }}"
          git checkout -b "${{ steps.version.outputs.release_branch }}"
          git push origin "${{ steps.version.outputs.release_branch }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Create pull request
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.version.outputs.release_branch }}" \
            --title "chore: release v${{ steps.version.outputs.new_version }}" \
            --body "Bumps version to ${{ steps.version.outputs.new_version }}. Auto-generated by the publish workflow."
