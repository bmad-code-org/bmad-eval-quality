# Publishes eval-quality to npmjs.org, cutting the release commit on main first when asked to.
#
# Run it with `npm run release:patch` (or minor, major), or Actions > Publish Package > Run
# workflow from main. The `bump` input decides what happens before the publish:
#
#   patch | minor | major   Runs `scripts/release-prepare.mjs <bump> --on-main`: bumps
#                           package.json and package-lock.json, stamps VERSION in src/index.ts and
#                           the [Unreleased] notes in CHANGELOG.md, commits
#                           `chore: release vX.Y.Z [skip ci]` on main, pushes with the job's own
#                           GITHUB_TOKEN. That push lands only because GitHub Actions is a bypass
#                           actor on the `protect-main` ruleset; nothing else may push there. The
#                           run then publishes that commit.
#   none                    Publishes the version main already declares. The fallback if the
#                           bypass is ever removed: `npm run release:prepare -- patch` on a laptop
#                           opens the release PR, a human merges it, and this run
#                           (`npm run release:publish`) publishes the merge commit.
#
# The commit being released is `release_sha` from the state step: HEAD, which is the bump commit
# after a bump and github.sha without one. github.sha is the pre-bump commit once a bump happened,
# so no step below the state step reads it.
#
# Every side-effecting step checks for its own earlier success, so a run after a partial failure
# finishes the release instead of colliding with it: publish is skipped when npm already has the
# version, the tag when it already points at release_sha, the Release when it already exists. A tag
# at a different commit, or an npm version published from a different commit, is a refusal. Recover
# by dispatching again with bump=none: the bump is already on main, and a re-run of the failed job
# is pinned to the pre-bump commit and refuses because main has moved.
#
# Uses npm trusted publishing (OIDC), not a static NPM_TOKEN secret: npm 11.5.1+ exchanges this job's
# GitHub Actions OIDC token for a short-lived publish credential automatically, so there is no
# long-lived npm token sitting in repo secrets for a compromised workflow or dependency to exfiltrate,
# and `npm publish --provenance` attaches a verifiable build-provenance attestation to the release.
# One-time setup this workflow cannot do for you: on npmjs.org, package Settings > Trusted Publisher >
# add this exact repo (bmad-code-org/bmad-eval-quality) and this exact workflow file (publish.yml).
# Until that link exists, `npm publish` below fails with an auth error, which is a safe failure mode:
# nothing has been tagged or released by then. CONTRIBUTING.md covers the first publish, which has
# to happen before the Trusted Publisher form exists.

name: Publish Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to cut on main before publishing (none = publish the version main already declares)"
        type: choice
        required: true
        default: patch
        options:
          - none
          - patch
          - minor
          - major

# One publish at a time, and a queued run waits rather than cancelling the one holding a half-done
# release.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  NPM_VERSION: "11.18.0"
  PACKAGE: eval-quality
  BUMP: ${{ inputs.bump }}

permissions:
  contents: write # push the tag, create the Release
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    # Both conditions are defense in depth, neither is the AD-18 guard (the first step below is):
    # github.ref restricts this to the branch releases are cut from, github.repository stops a fork's
    # workflow_dispatch (forks can dispatch workflows present in their own copy) from ever reaching a
    # step that references this repo's secrets/OIDC trust relationship.
    if: github.ref == 'refs/heads/main' && github.repository == 'bmad-code-org/bmad-eval-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # AD-18: publication is blocked by a mechanism, not policy prose. `workflow_dispatch` alone is
      # not the guard - anyone with dispatch access could otherwise trigger a real publish. This step
      # is the guard: it fails before any other step until the repository variable below is set,
      # which happens only once the work-related intellectual-property question is resolved in
      # writing.
      - name: Publication guard (AD-18)
        run: |
          if [ "${{ vars.PUBLICATION_UNBLOCKED }}" != "true" ]; then
            echo "Publication is blocked: the AD-18 intellectual-property question is not yet resolved in writing." >&2
            echo "Set the repository variable PUBLICATION_UNBLOCKED=true once it is, then re-run this workflow." >&2
            exit 1
          fi

      # persist-credentials (the default) leaves GITHUB_TOKEN in the checkout's remote, which is
      # what authorizes the release commit's push to main below. That push lands only because
      # GitHub Actions is a bypass actor on the `protect-main` ruleset (CONTRIBUTING.md,
      # Releasing); without that bypass, a bump push here is refused the same as anyone else's.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - uses: ./.github/actions/audit-lockfile-age

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Before the bump on purpose: a red main gets no release commit. The bump changes the four
      # stamped files only, and release-prepare refuses unless VERSION already matches the manifest,
      # so what it commits is the validated tree plus a version.
      - name: Run full validation suite
        run: npm run validate

      - name: Cut the release commit on main
        if: inputs.bump != 'none'
        run: node scripts/release-prepare.mjs "$BUMP" --on-main

      # Reads the version main declares and works out which side effects already happened. The
      # refusals here are the two states a re-run must not paper over.
      - name: Resolve release state
        id: state
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"
          # HEAD is the commit being released: the bump commit, or github.sha when there was none.
          # github.sha is stale after a bump, so every later step compares against and tags this.
          RELEASE_SHA="$(git rev-parse HEAD)"
          if [ "$BUMP" = "none" ] && [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "HEAD is $RELEASE_SHA but this run was dispatched at $GITHUB_SHA with bump=none." >&2
            exit 1
          fi
          if [ "$BUMP" != "none" ] && [ "$RELEASE_SHA" = "$GITHUB_SHA" ]; then
            echo "bump=$BUMP was requested but HEAD is still $GITHUB_SHA; no release commit was made." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Tag $TAG already exists at $TAG_SHA, and this run is releasing $RELEASE_SHA." >&2
              echo "Refusing to publish a version whose tag points elsewhere. Bump the version (bump input, or release:prepare), or move the tag by hand if it is wrong." >&2
              exit 1
            fi
            TAG_EXISTS=true
            echo "Tag $TAG already points at $RELEASE_SHA; the tag step will be skipped."
          fi
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

          NPM_HAS=false
          PUBLISHED="$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            # An absent gitHead is unverifiable, and unverifiable is refused
            # rather than accepted. npm records no gitHead for a package
            # published outside a git checkout, and a name someone else holds
            # would otherwise let this run tag our commit as their release.
            GIT_HEAD="$(npm view "$PACKAGE@$VERSION" gitHead 2>/dev/null || true)"
            if [ -z "$GIT_HEAD" ]; then
              echo "$PACKAGE@$VERSION is on npm and records no gitHead, so the commit it was published from cannot be verified." >&2
              echo "Refusing to tag or release against an unverifiable publication. Bump the version (bump input, or release:prepare)." >&2
              exit 1
            fi
            if [ "$GIT_HEAD" != "$RELEASE_SHA" ]; then
              echo "$PACKAGE@$VERSION is on npm, published from $GIT_HEAD, and this run is releasing $RELEASE_SHA." >&2
              echo "Refusing to tag a commit npm did not publish. Bump the version (bump input, or release:prepare)." >&2
              exit 1
            fi
            NPM_HAS=true
            echo "$PACKAGE@$VERSION is already on npm; the publish step will be skipped."
          fi
          echo "npm_has=$NPM_HAS" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: npm run build

      - name: Publish to npmjs.org
        if: steps.state.outputs.npm_has != 'true'
        # --provenance requires the id-token: write permission (granted above) and a public package;
        # no NODE_AUTH_TOKEN - trusted publishing exchanges this job's OIDC token for a short-lived
        # npm credential automatically once the registry-side Trusted Publisher link exists (see the
        # top-of-file comment). The bump commit is the only thing on GitHub by now, and it is the
        # thing a bump=none run publishes; a failure after the registry accepted the tarball is what
        # the re-run path above handles.
        run: npm publish --access public --provenance --tag latest
        env:
          # Only this step sets this; prepublishOnly (scripts/assert-publish-authorized.mjs) raises
          # the bar against a token-holder running `npm publish` from a laptop, but it is a speed bump,
          # not a credential boundary - `npm publish --ignore-scripts` skips prepublishOnly outright.
          # Trusted publishing is the actual credential-level control: nobody holds a long-lived npm
          # token to begin with, on a laptop or otherwise.
          EVAL_QUALITY_PUBLISH_AUTHORIZED: 'true'

      # Registry propagation is not instant. Bounded: two minutes, then fail rather than hang.
      - name: Verify publish
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "Verified $PACKAGE@$VERSION on npmjs.org (attempt $attempt)."
              exit 0
            fi
            sleep 5
          done
          echo "$PACKAGE@$VERSION not visible on npmjs.org after 24 attempts." >&2
          exit 1

      # No -f: the state step already proved the tag is absent, and a tag that appears between the
      # two steps is a real conflict, not something to overwrite.
      - name: Create and push git tag
        if: steps.state.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          RELEASE_SHA: ${{ steps.state.outputs.release_sha }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      # Body comes from the CHANGELOG section release-prepare stamped, then from [Unreleased] if the
      # stamp found nothing, then from GitHub's generated notes.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          has_release_notes() {
            awk '
              /^[[:space:]]*$/ { next }
              /^[[:space:]]*-{3,}[[:space:]]*$/ { next }
              { found = 1 }
              END { exit found ? 0 : 1 }
            ' <<< "$1"
          }
          BODY=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 ~ ("^##[[:space:]]*\\[?[[:space:]]*v?" ver "[[:space:]]*\\]?([[:space:]]*-[[:space:]].*)?$")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if ! has_release_notes "$BODY"; then
            BODY=$(awk '
              /^##[[:space:]]*\[Unreleased\]/ { found=1; next }
              /^## / {
                if (found) exit
                next
              }
              found { print }
            ' CHANGELOG.md)
            if has_release_notes "$BODY"; then
              echo "::notice::No CHANGELOG.md entry for $TAG; using [Unreleased] notes"
            fi
          fi
          if ! has_release_notes "$BODY"; then
            echo "::warning::No CHANGELOG.md entry for $TAG; falling back to auto-generated notes"
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$BODY"
          fi
