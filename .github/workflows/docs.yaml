name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/docs.yaml'
  # A broken docs build should redden the pull request that causes it. The
  # deploy job stays main-only, so a fork's pull request builds and never
  # publishes.
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/docs.yaml'

# The deploy job holds `pages: write` and `id-token: write`. The build job
# needs neither and reads no Pages settings, so a pull request builds the site
# on a repository where Pages has never been enabled.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_VERSION: "11.18.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - uses: ./.github/actions/audit-lockfile-age

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix website ci

      # Derived rather than read back from the Pages API. `configure-pages`
      # calls `GET /repos/{owner}/{repo}/pages`, which 404s until someone
      # enables Pages in repository settings, and it 404s on every pull request
      # too, so a build that only needs the base path cannot depend on it.
      # `https://<owner>.github.io/<repo>` is what Pages serves for a project
      # site, and this is the same value `website/src/lib/site-url.mjs` falls
      # back to; computing it here keeps it visible in the log.
      - name: Resolve the Pages base URL
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY##*/}"
          [ "$SITE_URL" != "https://.github.io/" ] || { echo "GITHUB_REPOSITORY was empty; SITE_URL would build the site against the wrong base path" >&2; exit 1; }
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "SITE_URL=$SITE_URL"

      - name: Validate documentation links
        run: npm run docs:validate-links

      # SITE_URL is the origin plus the project path. The origin alone collapses
      # `base` from `/bmad-eval-quality/` to `/`, which breaks every asset URL
      # and every rewritten link.
      - name: Build documentation site
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
