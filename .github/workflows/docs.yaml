name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/docs.yaml'
  # A broken docs build should redden the pull request that causes it. The
  # deploy job stays main-only, so a fork's pull request builds and never
  # publishes.
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/docs.yaml'

# The deploy job holds `pages: write` and `id-token: write`; the build job
# needs neither, and reads the Pages settings with `pages: read`.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_VERSION: "11.18.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - uses: ./.github/actions/audit-lockfile-age

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix website ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # An undefined step output expands to the empty string, which is how the
      # first version of this workflow shipped a `SITE_URL` that configured
      # nothing. Fail loudly instead.
      - name: Assert the Pages base URL resolved
        run: |
          [ -n "${{ steps.pages.outputs.base_url }}" ] || { echo "actions/configure-pages produced no base_url; SITE_URL would be empty and the site would build against the wrong base path" >&2; exit 1; }
          echo "base_url=${{ steps.pages.outputs.base_url }}"

      - name: Validate documentation links
        run: npm run docs:validate-links

      # `base_url` is the origin plus the project path. `origin` is the host
      # alone, and feeding that here collapses `base` from `/bmad-eval-quality/`
      # to `/`, which breaks every asset URL and every rewritten link.
      - name: Build documentation site
        run: npm run docs:build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
