name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NPM_VERSION: "11.18.0"

jobs:
  validate-and-build:
    name: Node 24 (validate + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - uses: ./.github/actions/audit-lockfile-age

      - name: Install dependencies
        run: npm ci

      - name: Licence scan
        run: node scripts/check-licenses.mjs

      # Named so a red build says which gate failed; `npm run validate` runs
      # them again inside the validate step, which is deliberate redundancy
      # rather than the only wiring.
      - name: Published schema drift check (byte-exact against schemas/)
        run: npm run check:schemas

      - name: AD-5 failure-code registry check (FAILURE_CODES vs the spine table)
        run: npm run check:ad5-registry

      - name: AD-31 coverage predicate table drift check (byte-exact against docs/)
        run: npm run check:ad31-table

      - name: AD-33 outcome decision table drift check (byte-exact against docs/)
        run: npm run check:ad33-table

      - name: AD-21 verdict decision table drift check (byte-exact against docs/)
        run: npm run check:ad21-table

      - name: Worked-example chain drift check (byte-exact against the regenerated chain)
        run: npm run check:worked-example

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Test spine linter
        run: pip install pytest && python -m pytest scripts/spine-lint/tests -q

      - name: Shareable export check (current, and canonical repository URL)
        run: npm run check:shareable

      - name: Port conformance suite (every shipped adapter plus the in-repository probe subject)
        run: npm run test:conformance

      # The documentation site's lockfile is a second resolved graph, and
      # `npm --prefix website ci` reads no project `.npmrc` from the root, so
      # AD-25 and the age policy have to be applied to it explicitly.
      - name: Website dependency audit (lockfile age and AD-25 licences)
        run: npm run check:website-deps

      # Every command line the documentation shows is executed. Exit 64 means
      # the documented command or flag does not exist.
      - name: Documented CLI invocations
        run: npm run check:doc-invocations

      # CI only, and deliberately outside `npm run validate`: this is the one
      # check that queries the npm advisory database, and `validate` has to
      # stay runnable with no network. Both lockfiles are audited because the
      # documentation site resolves its own graph. `--omit=dev` would exempt
      # almost everything here, since every root dependency but `zod` is a dev
      # dependency, so the level is the filter and the scope is everything.
      - name: Known-vulnerability audit (advisory DB, CI only)
        run: |
          npm audit --audit-level=high
          npm --prefix website audit --audit-level=high

      # Before the two steps that run the suite. The published-surface cases
      # resolve `dist/` through the `exports` map and skip with a clear message
      # when it is absent, so an unbuilt tree would turn eight of them into a
      # silent skip inside a green gate.
      - name: Build
        run: npm run build

      # `npm run validate` ends in `test:coverage`, so the AD-30/NFR7 floor is
      # already enforced here. A separate coverage step beside this one would
      # run the whole suite twice in one job for nothing.
      - name: Validate (typecheck, lint, check:docs, check:doc-invocations, check:shareable, lint:spine, check:vectors, check:schemas, check:ad5-registry, check:ad28-registry, check:ad31-table, check:ad33-table, check:ad21-table, check:layers, check:lineage, check:boundary, check:corpus, check:worked-example, check:website-deps, and the AD-30/NFR7 coverage floor via test:coverage)
        run: npm run validate

  floor:
    name: Node 22.20.0 (floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.20.0"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - uses: ./.github/actions/audit-lockfile-age

      - name: Install dependencies
        run: npm ci

      # Every type-stripped script runs here as well as on Node 24. `build`
      # goes through tsc and `test` through Vite's transform, so neither
      # exercises Node's own type stripper; without these steps the declared
      # engines floor is unproven for exactly the files that depend on it, and
      # a contributor on 22.20.0 would be the first to find out. Adding a
      # `node scripts/*.ts` command to `validate` means adding it here too.
      - name: Published schema drift check (byte-exact against schemas/)
        run: npm run check:schemas

      - name: AD-5 failure-code registry check (FAILURE_CODES vs the spine table)
        run: npm run check:ad5-registry

      - name: AD-31 coverage predicate table drift check (byte-exact against docs/)
        run: npm run check:ad31-table

      - name: AD-33 outcome decision table drift check (byte-exact against docs/)
        run: npm run check:ad33-table

      - name: AD-21 verdict decision table drift check (byte-exact against docs/)
        run: npm run check:ad21-table

      - name: AD-15 package-boundary check (src/, corpus/, and the published manifest fields)
        run: npm run check:boundary

      - name: Dev corpus drift check (byte-exact against corpus/)
        run: npm run check:corpus

      - name: Worked-example chain drift check (byte-exact against the regenerated chain)
        run: npm run check:worked-example

      - name: Build
        run: npm run build

      # Replaces the plain `npm run test` step: the floor job never runs
      # `npm run validate`, so a coverage step added only to the Node 24 job
      # would run the floor twice there and zero times on the declared engines
      # floor, which is the job AD-30's last sentence is about. Measured:
      # `npm run test` 42 s, `vitest run --coverage` 63 s.
      - name: Test with the AD-30 coverage floor
        run: npm run test:coverage

      - name: Port conformance suite (every shipped adapter plus the in-repository probe subject)
        run: npm run test:conformance

  canary-age:
    name: "Canary: lockfile age audit fails on a young entry"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Assert the audit fails, naming the fixture's young entry
        run: |
          set +e
          published="$(npm view zod@4.4.3 time --json | node -e '
            let raw = "";
            process.stdin.on("data", (c) => { raw += c })
            process.stdin.on("end", () => { console.log(JSON.parse(raw)["4.4.3"]) })
          ')"
          pinned_now="$(node -e "
            const p = new Date(process.argv[1]);
            p.setUTCDate(p.getUTCDate() + 1);
            console.log(p.toISOString());
          " "$published")"
          echo "zod@4.4.3 published $published; pinning audit clock to $pinned_now"
          output="$(node scripts/audit-lockfile-age.mjs --lockfile scripts/fixtures/age-canary/package-lock.json --now "$pinned_now" 2>&1)"
          exit_status=$?
          set -e
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the audit to fail (age-window policy reason), but it passed" >&2
            exit 1
          fi
          # Match the age-specific line, not a bare "zod@4.4.3" substring: the unfetchable-metadata
          # branch (a registry outage, say) prints the byte-identical "zod@4.4.3 (node_modules/zod)"
          # shape and would otherwise pass this canary for the wrong reason.
          echo "$output" | grep -q "published inside the 7-day window" || { echo "audit failed for the wrong reason (no age-window violation reported)" >&2; exit 1; }
          echo "$output" | grep -q "zod@4.4.3 published" || { echo "audit failed for the wrong reason (did not name zod@4.4.3 as published/young)" >&2; exit 1; }
          echo "canary passed: audit correctly failed naming zod@4.4.3 as published inside the age window"

  canary-git:
    name: "Canary: npm ci blocks a git dependency"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Copy the live root policy into the fixture (project .npmrc is not inherited across directories)
        run: |
          cp "$GITHUB_WORKSPACE/.npmrc" scripts/fixtures/git-canary/.npmrc
          # The canary is only meaningful if the copied policy actually carries every line the real
          # .npmrc is supposed to have; a truncated or misnamed copy would silently narrow what this
          # canary (and the real `npm ci`) enforce.
          for key in allow-git=none allow-remote=none min-release-age=7 save-exact=true; do
            grep -qF "$key" scripts/fixtures/git-canary/.npmrc || { echo "copied .npmrc is missing '$key'" >&2; exit 1; }
          done

      - name: Assert npm ci is blocked for the git-dependency policy reason
        working-directory: scripts/fixtures/git-canary
        run: |
          set +e
          output="$(npm ci 2>&1)"
          exit_status=$?
          set -e
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected npm ci to fail (git dependencies blocked), but it succeeded" >&2
            exit 1
          fi
          echo "$output" | grep -q "EALLOWGIT" || { echo "npm ci failed for the wrong reason (expected EALLOWGIT)" >&2; exit 1; }
          echo "canary passed: npm ci correctly blocked the git dependency (EALLOWGIT)"

  canary-remote:
    name: "Canary: npm ci blocks a remote-tarball dependency"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Copy the live root policy into the fixture (project .npmrc is not inherited across directories)
        run: |
          cp "$GITHUB_WORKSPACE/.npmrc" scripts/fixtures/remote-canary/.npmrc
          # The canary is only meaningful if the copied policy actually carries every line the real
          # .npmrc is supposed to have; a truncated or misnamed copy would silently narrow what this
          # canary (and the real `npm ci`) enforce.
          for key in allow-git=none allow-remote=none min-release-age=7 save-exact=true; do
            grep -qF "$key" scripts/fixtures/remote-canary/.npmrc || { echo "copied .npmrc is missing '$key'" >&2; exit 1; }
          done

      - name: Assert npm ci is blocked for the remote-tarball policy reason
        working-directory: scripts/fixtures/remote-canary
        run: |
          set +e
          output="$(npm ci 2>&1)"
          exit_status=$?
          set -e
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected npm ci to fail (remote-tarball dependencies blocked), but it succeeded" >&2
            exit 1
          fi
          echo "$output" | grep -q "EALLOWREMOTE" || { echo "npm ci failed for the wrong reason (expected EALLOWREMOTE)" >&2; exit 1; }
          echo "canary passed: npm ci correctly blocked the remote-tarball dependency (EALLOWREMOTE)"

  canary-licence:
    name: "Canary: licence scan fails on a disallowed licence"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Assert the scan fails, naming the disallowed licence and the exact dependency path
        run: |
          set +e
          output="$(node scripts/check-licenses.mjs --lockfile scripts/fixtures/licence-canary/package-lock.json 2>&1)"
          exit_status=$?
          set -e
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the scan to fail (licence-allowlist policy reason), but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "gpl-violator@1.0.0" || { echo "scan failed for the wrong reason (did not name gpl-violator@1.0.0)" >&2; exit 1; }
          # The fixture nests the violation behind a scoped parent on purpose: this is also the
          # regression lock for the ancestor-walk bug that used to lose the dependency path for every
          # scoped package (e.g. all 8 @biomejs/cli-* platform binaries).
          echo "$output" | grep -q "dependency path: licence-canary-fixture > @fixture-scope/parent > gpl-violator" || { echo "scan did not report the correct dependency path through the scoped parent" >&2; exit 1; }
          echo "canary passed: licence scan correctly failed naming gpl-violator with the right dependency path"

  canary-schema-drift:
    name: "Canary: drift check fails on a mutated byte and on an orphan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The gate this repository already paid for twice: a check that never
      # blocks anything protects nothing. `check:schemas` is the only thing
      # standing between the Zod source and a committed export that no longer
      # matches it, so it is proven to block, for the stated reason, rather
      # than assumed to.
      - name: Assert the drift check fails on a single mutated byte
        run: |
          set +e
          printf 'x' >> schemas/scoring-policy.schema.json
          output="$(npm run --silent check:schemas 2>&1)"
          exit_status=$?
          set -e
          git checkout -- schemas/scoring-policy.schema.json
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the drift check to fail on a mutated byte, but it passed" >&2
            exit 1
          fi
          # Match the drift line specifically: a missing-file or unexpected-entry
          # failure would also exit non-zero and would pass a bare exit-code test
          # for the wrong reason.
          echo "$output" | grep -q "scoring-policy.schema.json: drift at byte offset" || { echo "check failed for the wrong reason (no byte-offset drift reported)" >&2; exit 1; }
          echo "canary passed: drift check correctly failed naming the differing byte offset"

      - name: Assert the drift check fails on a file no registry key names
        run: |
          set +e
          printf '{}' > schemas/orphan.schema.json
          output="$(npm run --silent check:schemas 2>&1)"
          exit_status=$?
          set -e
          rm -f schemas/orphan.schema.json
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the drift check to fail on an orphan file, but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "orphan.schema.json: present on disk but no registry key names it" || { echo "check failed for the wrong reason (did not name the orphan)" >&2; exit 1; }
          echo "canary passed: drift check correctly failed naming the orphan file"

      # Regeneration is the repair every failure message above names, so the
      # repair is proven to be a fixed point rather than assumed to be one.
      - name: Assert generate then check is a fixed point
        run: |
          npm run --silent generate:schemas > /dev/null
          git diff --exit-code -- schemas/ || { echo "generate:schemas rewrote the committed export; the two are out of step" >&2; exit 1; }
          npm run --silent check:schemas
          echo "canary passed: generate:schemas reproduces the committed bytes exactly"

  canary-ad5-registry:
    name: "Canary: AD-5 registry check fails on a dropped and on a reordered code"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The epic's standing prohibition is that the failure-code enumeration
      # must not be hand-maintained beside AD-5's table. That prohibition is
      # only mechanical if the check that enforces it demonstrably blocks.
      - name: Assert the registry check fails when a code is dropped
        run: |
          set +e
          node -e "
            const fs = require('node:fs');
            const path = 'src/core/failure-codes.ts';
            const source = fs.readFileSync(path, 'utf8');
            const dropped = source.replace(\"\t'waiver-incomplete',\n\", '');
            if (dropped === source) { console.error('fixture setup failed: waiver-incomplete not found'); process.exit(1) }
            fs.writeFileSync(path, dropped);
          "
          output="$(npm run --silent check:ad5-registry 2>&1)"
          exit_status=$?
          set -e
          git checkout -- src/core/failure-codes.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the registry check to fail on a dropped code, but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "waiver-incomplete\` is in the AD-5 table but missing from src/core/failure-codes.ts" || { echo "check failed for the wrong reason (did not name the dropped code)" >&2; exit 1; }
          echo "canary passed: registry check correctly failed naming the dropped code"

      - name: Assert the registry check fails when two codes are transposed
        run: |
          set +e
          node -e "
            const fs = require('node:fs');
            const path = 'src/core/failure-codes.ts';
            const source = fs.readFileSync(path, 'utf8');
            const pair = \"\t'rubric-unanchored',\n\t'rubric-evidence-unreachable',\n\";
            if (!source.includes(pair)) { console.error('fixture setup failed: the pair was not found in order'); process.exit(1) }
            fs.writeFileSync(path, source.replace(pair, \"\t'rubric-evidence-unreachable',\n\t'rubric-unanchored',\n\"));
          "
          output="$(npm run --silent check:ad5-registry 2>&1)"
          exit_status=$?
          set -e
          git checkout -- src/core/failure-codes.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the registry check to fail on transposed codes, but it passed" >&2
            exit 1
          fi
          # Set equality still holds after a transposition, so only the order
          # comparison can catch this. Matching the order line specifically is
          # what keeps this canary from passing on a set-equality failure.
          echo "$output" | grep -q "order mismatch at position" || { echo "check failed for the wrong reason (no order mismatch reported)" >&2; exit 1; }
          echo "canary passed: registry check correctly failed naming the order mismatch"

  canary-ad28-registry:
    name: "Canary: AD-28 registry check fails on a dropped and on a reordered code"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # AD-28 publishes a normative runtime fault registry, so the tuple in
      # `src/core/schemas/faults.ts` must not be hand-maintained beside it.
      # That prohibition is only mechanical if the check that enforces it
      # demonstrably blocks. `tests/architecture/ad28-registry.test.ts` proves
      # the same detection logic in-process; this job proves the shipped
      # command exits nonzero and names the drift.
      - name: Assert the registry check fails when a code is dropped
        run: |
          set +e
          node -e "
            const fs = require('node:fs');
            const path = 'src/core/schemas/faults.ts';
            const source = fs.readFileSync(path, 'utf8');
            const dropped = source.replace(\"\t'aborted',\n\", '');
            if (dropped === source) { console.error('fixture setup failed: aborted not found'); process.exit(1) }
            fs.writeFileSync(path, dropped);
          "
          output="$(npm run --silent check:ad28-registry 2>&1)"
          exit_status=$?
          set -e
          git checkout -- src/core/schemas/faults.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the registry check to fail on a dropped code, but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "aborted\` is in the AD-28 table but missing from src/core/schemas/faults.ts" || { echo "check failed for the wrong reason (did not name the dropped code)" >&2; exit 1; }
          echo "canary passed: registry check correctly failed naming the dropped code"

      - name: Assert the registry check fails when two codes are transposed
        run: |
          set +e
          node -e "
            const fs = require('node:fs');
            const path = 'src/core/schemas/faults.ts';
            const source = fs.readFileSync(path, 'utf8');
            const pair = \"\t'port-failure',\n\t'port-contract-violation',\n\";
            if (!source.includes(pair)) { console.error('fixture setup failed: the pair was not found in order'); process.exit(1) }
            fs.writeFileSync(path, source.replace(pair, \"\t'port-contract-violation',\n\t'port-failure',\n\"));
          "
          output="$(npm run --silent check:ad28-registry 2>&1)"
          exit_status=$?
          set -e
          git checkout -- src/core/schemas/faults.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the registry check to fail on transposed codes, but it passed" >&2
            exit 1
          fi
          # Set equality still holds after a transposition, so only the order
          # comparison can catch this. Matching the order line specifically is
          # what keeps this canary from passing on a set-equality failure.
          echo "$output" | grep -q "order mismatch at position" || { echo "check failed for the wrong reason (no order mismatch reported)" >&2; exit 1; }
          echo "canary passed: registry check correctly failed naming the order mismatch"

  canary-ad31-table:
    name: "Canary: AD-31 table check fails on a mutated byte and on a changed predicate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Assert the table check fails on a single mutated byte
        run: |
          set +e
          printf 'x' >> docs/ad31-coverage-predicates.generated.md
          output="$(npm run --silent check:ad31-table 2>&1)"
          exit_status=$?
          set -e
          git checkout -- docs/ad31-coverage-predicates.generated.md
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the table check to fail on a mutated byte, but it passed" >&2
            exit 1
          fi
          # Match the drift line specifically: a missing-file failure also exits
          # non-zero and would pass a bare exit-code test for the wrong reason.
          echo "$output" | grep -q "ad31-coverage-predicates.generated.md: drift at byte offset" || { echo "check failed for the wrong reason (no byte-offset drift reported)" >&2; exit 1; }
          echo "canary passed: table check correctly failed naming the differing byte offset"

      # The canary that proves AD-31's central claim: the table is emitted by
      # the implemented predicates rather than kept beside them. A byte
      # mutation alone would pass under a hand-maintained table.
      - name: Assert the table check fails when a predicate identifier changes
        run: |
