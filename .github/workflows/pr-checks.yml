  canary-coverage:
    name: "Canary: the coverage floor blocks when it is not met"
    runs-on: ubuntu-latest
    # One seeded coverage run at roughly a minute, plus `npm ci` and `build`.
    # The restore is asserted with `git diff` rather than a second suite run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The suite's published-surface cases read `dist/` and skip without it.
      - name: Build
        run: npm run build

      # The threshold value is only half the floor; the other half is the set it
      # is measured over. Widening `coverage.include` to `src/**` would let
      # well-tested adapters carry a thin core and still clear 90%, and the
      # seeded-threshold step below would not notice. AD-30's floor is over
      # `core/`, so the measured set is gated here rather than assumed.
      - name: Assert the coverage floor is measured over src/core/ alone
        run: |
          grep -q "include: \['src/core/\*\*'\]" vitest.config.ts || { echo "vitest.config.ts no longer declares coverage.include as ['src/core/**']; AD-30's floor is over core/ specifically, and a widened set would let an adapter mask a thin core" >&2; grep -n "include:" vitest.config.ts >&2; exit 1; }
          echo "canary passed: the coverage floor is still measured over src/core/ alone"

      # AD-30's floor is enforced by vitest's own thresholds, so the thing to
      # prove is that the threshold blocks. `vitest.config.ts` is TypeScript,
      # so the edit is `sed -i` the way the AD-31 canary does it.
      - name: Assert the coverage run fails when the threshold is not met
        run: |
          set +e
          sed -i "s|statements: 90|statements: 100|" vitest.config.ts
          git diff --quiet -- vitest.config.ts && { echo "the seeded threshold edit was a no-op; vitest.config.ts no longer carries 'statements: 90' for the sed to raise" >&2; exit 1; }
          output="$(npm run --silent test:coverage 2>&1)"
          exit_status=$?
          set -e
          git checkout -- vitest.config.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the coverage run to fail below the threshold, but it passed" >&2
            exit 1
          fi
          # Name the axis the seed actually raised. A bare "does not meet global
          # threshold" carries no axis at all, so a branches-line failure under an
          # untouched statements floor would pass this canary for the wrong reason.
          # So would a syntax error in the config, which also exits non-zero.
          echo "$output" | grep -q "Coverage for statements .* does not meet global threshold (100%)" || { echo "check failed for the wrong reason (no statements-axis violation against the seeded 100% floor)" >&2; exit 1; }
          echo "canary passed: the coverage threshold blocks and names the statements axis"

      # What the step above actually needs to claim is that its seed was undone,
      # and `git diff` says that in milliseconds. Re-running the suite to prove
      # a green tree would be the fifth full coverage run of one pull request,
      # after `validate-and-build`, `floor`, and this job's own seeded run.
      - name: Assert the seeded config was restored
        run: git diff --exit-code -- vitest.config.ts

  canary-boundary:
    name: "Canary: the package-boundary check fails on a seeded reference"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # AD-15 had no enforcement at all until this check existed, so it is
      # proven to block, for the stated reason, rather than assumed to.
      - name: Assert the boundary check fails on a seeded source reference
        run: |
          set +e
          sed -i "1i // Story 9.9 seeded this line" src/core/failure-codes.ts
          output="$(npm run --silent check:boundary 2>&1)"
          exit_status=$?
          set -e
          git checkout -- src/core/failure-codes.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the boundary check to fail on a seeded reference, but it passed" >&2
            exit 1
          fi
          # Match the file and the pattern name: a discovery failure also exits
          # non-zero and would pass a bare exit-code test for the wrong reason.
          echo "$output" | grep -q "src/core/failure-codes.ts:1 \[story\]" || { echo "check failed for the wrong reason (no seeded violation reported)" >&2; exit 1; }
          echo "canary passed: boundary check correctly failed naming the file and the pattern"

      # The manifest is scanned as three synthetic entries, and the package's
      # own URL coordinates are exempt, so the seed goes into `description`.
      - name: Assert the boundary check fails on a seeded manifest reference
        run: |
          set +e
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.description="TEA drafts a contract and calls this package.";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          output="$(npm run --silent check:boundary 2>&1)"
          exit_status=$?
          set -e
          git checkout -- package.json
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the boundary check to fail on a seeded manifest reference, but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "package.json#description:1 \[TEA\]" || { echo "check failed for the wrong reason (no manifest violation reported)" >&2; exit 1; }
          echo "canary passed: boundary check reaches the published manifest fields"

      # The third arm of the scanned set. `corpus/` ships in the tarball beside
      # `dist/`, and the walk that reaches it is separate from the `src/` one,
      # so a regression in it would leave both steps above green. Seeded a
      # directory deep, because a walk that stopped at `corpus/` itself would
      # still find a file in the root.
      - name: Assert the boundary check fails on a seeded corpus reference
        run: |
          set +e
          printf 'Seeded by the boundary canary: _bmad-output/planning-artifacts is not published.\n' > corpus/dev/boundary-canary.md
          output="$(npm run --silent check:boundary 2>&1)"
          exit_status=$?
          set -e
          rm -f corpus/dev/boundary-canary.md
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the boundary check to fail on a seeded corpus reference, but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "corpus/dev/boundary-canary.md:1 \[_bmad-output\]" || { echo "check failed for the wrong reason (the corpus walk did not report the seeded file and pattern)" >&2; exit 1; }
          echo "canary passed: boundary check reaches files under corpus/"

      - name: Assert the restored tree is clean
        run: npm run --silent check:boundary

  canary-dev-corpus:
    name: "Canary: the corpus check fails on a mutated byte and on a changed seed"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: ./.github/actions/assert-npm-version
        with:
          version: ${{ env.NPM_VERSION }}

      # Every step below restores its seed with `git checkout -- corpus/…` and
      # reads `git status --porcelain -- corpus/`. Both are meaningless while
      # the generated corpus is untracked: under `set -e` the restore aborts
      # with a bare pathspec error and the fixed-point step trips over `??
      # corpus/`. Committing the directory is the fix, so say that rather than
      # leaving the job to report it as a git usage error three steps later.
      - name: Assert the generated corpus is committed
        run: |
          git ls-files --error-unmatch corpus/dev/index.json > /dev/null 2>&1 || { echo "corpus/ is not tracked by git; the generated corpus must be committed for this canary to mean anything, since every step below restores its seed with 'git checkout -- corpus/...' and asserts on 'git status --porcelain -- corpus/'" >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Assert the corpus check fails on a single mutated byte
        run: |
          set +e
          printf 'x' >> corpus/dev/index.json
          output="$(npm run --silent check:corpus 2>&1)"
          exit_status=$?
          set -e
          git checkout -- corpus/dev/index.json
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the corpus check to fail on a mutated byte, but it passed" >&2
            exit 1
          fi
          # Match the drift line specifically: a missing-file failure also exits
          # non-zero and would pass a bare exit-code test for the wrong reason.
          echo "$output" | grep -q "corpus/dev/index.json: drift at byte offset" || { echo "check failed for the wrong reason (no byte-offset drift reported)" >&2; exit 1; }
          echo "canary passed: corpus check correctly failed naming the differing byte offset"

      # The canary that proves the corpus is emitted rather than kept beside
      # the code: changing the seed the corpus is generated *from* must move
      # the committed bytes.
      - name: Assert the corpus check fails when the seed contract changes
        run: |
          set +e
          sed -i "s|A created thing is readable back in the list of things.|A created thing is readable back in the list.|" tests/coverage/fixtures/satisfaction-contracts.ts
          git diff --quiet -- tests/coverage/fixtures/satisfaction-contracts.ts && { echo "the seed edit was a no-op" >&2; exit 1; }
          output="$(npm run --silent check:corpus 2>&1)"
          exit_status=$?
          set -e
          git checkout -- tests/coverage/fixtures/satisfaction-contracts.ts
          echo "$output"
          if [ $exit_status -eq 0 ]; then
            echo "expected the corpus check to fail on a changed seed, but it passed" >&2
            exit 1
          fi
          echo "$output" | grep -q "drift at byte offset" || { echo "check failed for the wrong reason (no byte-offset drift reported)" >&2; exit 1; }
          echo "canary passed: the committed corpus moves with the fixtures that emit it"

      # Regeneration is the repair every failure message above names, so the
      # repair is proven to be a fixed point rather than assumed to be one.
      #
      # `brief.json` is deleted first so the generate call is load-bearing. On
      # an already-clean tree both assertions below hold for a generator that
      # writes nothing at all, and the step would report a fixed point it never
      # exercised.
      - name: Assert generate then check is a fixed point
        run: |
          set -e
          rm corpus/dev/compile-seal-example/brief.json
          npm run --silent generate:dev-corpus > /dev/null
          # `git status --porcelain`, because `git diff` reports no untracked
          # file: a generator writing to a path the check does not read would
          # leave the committed corpus intact and pass a diff test.
          [ -z "$(git status --porcelain -- corpus/)" ] || { echo "generate:dev-corpus left corpus/ dirty; the writer and the check are out of step, or the generator did not rewrite the deleted brief.json" >&2; git status --porcelain -- corpus/ >&2; exit 1; }
          npm run --silent check:corpus
