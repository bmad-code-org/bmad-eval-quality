name: 'Audit lockfile publication age'
description: >
  Runs scripts/audit-lockfile-age.mjs before `npm ci` and asserts its printed effective clock is
  within 24h of the runner's real time, so a clock-parsing bug in the script cannot silently make
  every entry look permanently "old enough" (or make the audit itself look like it never ran).

inputs:
  lockfile:
    description: 'Path to the package-lock.json to audit.'
    required: false
    default: 'package-lock.json'
  cache:
    description: >
      Path to a committed publication cache, mapping "name@version" to a publication timestamp. An
      entry it carries is used with no request; an entry it does not is fetched. Left empty the audit
      fetches everything, and a path that is not there is a refusal rather than a silent full fetch.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Audit lockfile publication age
      shell: bash
      run: |
        set +e
        cache_flag=""
        if [ -n "${{ inputs.cache }}" ]; then
          cache_flag="--cache ${{ inputs.cache }}"
        fi
        # Unquoted on purpose: empty means no flag at all, and the value is a
        # repository-relative path this workflow writes.
        # shellcheck disable=SC2086
        output="$(node scripts/audit-lockfile-age.mjs --lockfile "${{ inputs.lockfile }}" $cache_flag)"
        exit_status=$?
        set -e
        echo "$output"
        effective_clock="$(printf '%s\n' "$output" | sed -n 's/^Effective clock: //p')"
        if [ -z "$effective_clock" ]; then
          echo "audit did not print an effective clock line" >&2
          exit 1
        fi
        node -e "
          const eff = new Date(process.argv[1]).getTime();
          if (Number.isNaN(eff)) { console.error('effective clock is unparseable: ' + process.argv[1]); process.exit(1); }
          const driftHours = Math.abs(Date.now() - eff) / 3600000;
          if (driftHours > 24) { console.error('effective clock drifted ' + driftHours.toFixed(2) + 'h from real time (date -u)'); process.exit(1); }
          console.log('effective clock ok: drift ' + driftHours.toFixed(2) + 'h from date -u');
        " "$effective_clock"
        exit $exit_status
