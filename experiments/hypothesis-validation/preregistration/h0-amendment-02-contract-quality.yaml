runPlan:
  runId: cc-h0-03-independent-mut2-contract-v2
  condition: independent
  repetitions: 1
  comparisonRunId: cc-h0-03-independent-mut2
  doNotOverwrite: |
    The comparison run is valid evidence and must remain unchanged. This round uses a distinct run
    ID and distinct artifacts.
  launch:
    session: fresh non-persistent Claude Code session
    workingDirectory: fresh scratch directory outside eval-quality
    claudeCodeVersion: 2.1.219
    model: claude-sonnet-5
    safeMode: true
    permissionMode: dontAsk
    outputCapture: stream-json outside eval-quality
  inputsAllowed:
    - strengthened Eval Contract JSON pasted inline
    - base URL http://localhost:4002
    - guardian-1 and guardian-2 scoped test-token auth headers
  inputsDenied:
    - original-spec
    - source-code
    - repository
    - builder-transcript
    - implementation-logs
    - comparator-results
    - human-labels
    - mutation-details
    - prior run results
    - eval-quality working tree
  toolsAllowed:
    - HTTP requests to http://localhost:4002
    - writing the two named scratch output files
  toolsDenied:
    - filesystem reads
    - git
    - grep
    - find
    - ls
    - web search
    - network access outside http://localhost:4002
  sealing: |
    The arm returns structured behavior verdicts and findings. The orchestrator writes the H0 result
    record and final isolation manifest, computes every SHA-256 digest, checks every artifact
    reference, and validates all records with Ajv. The arm must not author its own scored result.

outcomeRules:
  causalSupport: |
    Supported for this case if the run is valid and the arm emits a material defect finding for
    B-002 backed by a request that supplies at least two filters together and response evidence that
    capsules matching only a strict subset were returned. The finding must map to D-001. The task
    verdict must be FAIL.
  causalNotSupported: |
    Not supported for this case if a valid run still misses D-001, lacks composed-filter evidence,
    or produces a verdict other than FAIL.
  invalid: |
    Invalidate the run for any prohibited-input access, network target outside localhost:4002,
    model mismatch, prompt-template mismatch, contract mismatch, budget breach, missing artifact,
    digest mismatch, or schema-validation failure. An invalid run produces no causal conclusion.

claimBoundary: |
  This is a post-mut2 causal mechanism test using a controlled mutation and a deliberately improved
  oracle. It cannot satisfy the H0 three-real-defect gate, create a unique catch for the original
  frozen condition, or move H0 to DARK-FACTORY VALIDATED. A positive result supports the narrower
  claim that contract and oracle authoring controlled recall for this case. Generalization still
  requires more defects, tasks, and both systems.

