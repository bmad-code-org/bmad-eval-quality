rationale: |
  The valid mut2 independent run missed D-001 because the frozen B-002 oracle required only a
  single-filter probe. Both contextual arms caught D-001 after inspecting builder-side material
  that pointed at filter composition. This round tests the mechanism directly. It strengthens the
  oracle to require evidence that distinguishes full matches from partial matches when multiple
  filters are supplied, then reruns only the sealed independent arm against the unchanged mutation.

  The intervention is deliberately narrow. It does not name the mutation, the faulty operator, the
  known leaking request, any existing capsule, the ground-truth defect ID, or the prior arm results.
  The original spec digest, behavior description, risk hypotheses, prompt template, model, budgets,
  interface, credentials, mutation, and ground truth remain unchanged.

primaryQuestion: |
  Does strengthening B-002's oracle to make filter composition observable cause a fresh sealed
  independent evaluator to detect the existing material defect that the valid mut2 sealed run
  missed?

contracts:
  original:
    path: ../independent-evaluator/eval-contracts/cc-h0-03-capsule-crud-search.json
    digest: "sha256:56b032a14120dbace5c8755f58bb3f94210e104196981ef9eadb4a3b7f206ecd"
  strengthened:
    path: ../independent-evaluator/eval-contracts/cc-h0-03-capsule-crud-search-contract-quality-v2.json
    digest: "sha256:4019461bb75fbc2aa9da28b29d30bd31a5fe952ff4f3930d0f24a45541e36b7c"
  controlledDiff: |
    Exactly one JSON value changes: observableBehaviors[B-002].oracle. A byte-level diff was
    reviewed during preparation and showed no other contract change.
  strengthenedOracle: |
    Filter composition is observable only when the test data distinguishes a capsule matching
    every supplied filter from capsules matching only a strict subset. Evidence must exercise at
    least two filters together and include both a full match and partial matches. A capsule belongs
    in the composed result only when it satisfies every supplied filter; capsules satisfying only
    a subset must be excluded.

measurementCorrection:
  findingType:
    schemaPath: ../schemas/h0-run-result.schema.json
    schemaDigest: "sha256:f030502a8dcb2d2550c6d0fa95b30aeb622c65603531bd0e9e13aa92becee9c1"
    allowedValues:
      - defect
      - observation
      - confirmation
    treatment: |
      Every finding in this round must carry findingType. Only defect findings enter the precision
      denominator. Observations and positive confirmations remain visible without being counted as
      alleged failures. The property is additive in the shared schema so prior schema-valid mut2
      records remain valid.

