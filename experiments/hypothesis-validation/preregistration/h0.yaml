mappingRules: |
  Findings map to a ground-truth defect ID if: (a) the finding's behaviorId matches a defect's
  behaviorId, and (b) the finding's cited evidence is consistent with the defect's oracleEvidence
  (same underlying observable fact, not necessarily identical wording). Under the no-Reviewer-B
  deviation, ground truth is established once by the judge/orchestrator role (see
  prompts/judges/judge-prompt-template.md) BEFORE self/independent results are read, and mapping
  is performed by the same role — disclosed as a limitation, not hidden. A finding with no
  reproducible evidence artifact does not count toward precision regardless of its verdict.

privacyManifestDigest: null # populate once private-evidence-manifest.json has real entries (none yet — no scored run has occurred)

metrics:
  - H0 precision (section 9, target >= 0.85)
  - H0 recall (section 9, target >= 0.80)
  - H0 unique catch count (target >= 3, spanning both systems)
  - H0 false-FAIL / false-CONCERNS on clean implementations (targets: 0 false FAIL, <=1 false CONCERNS)
  - H0 stability — N/A under reduced scope (single repetition; recorded as a deviation, not scored)

gates: |
  Per plan section 9, ALL of the following, adapted for reduced scope (4 tasks, not 12; targets
  below are the plan's own thresholds — reduced task count does not relax the thresholds, it only
  shrinks the sample they're computed over, which is itself a disclosed limitation on statistical
  confidence):
  1. Independent evaluator catches >= 3 real, material defects missed by self-evaluator and all
     applicable deterministic/scripted baselines.
  2. Those catches span both systems.
  3. Precision >= 0.85, recall >= 0.80 across the 4 tasks.
  4. Zero false FAIL, at most 1 false CONCERNS on clean implementations.
  5. At least 1 material defect found through an evaluator-chosen action absent from any fixed baseline.
  6. Every independent run has a complete, violation-free isolation manifest.
  7. At least 1 finding changes a real ship/remediation decision (Murat's judgment call at DECISION.md stage).
  8. Stability gate (0.90 across 3 reps): N/A, single repetition — recorded, not silently dropped.

invalidationRules: |
  Same as plan section 12 "Stop rules": invalidate a condition if its prompt, model, resource
  ceiling, system SHA/private-revision digest, or contract digest differs from this file. Invalidate
  self/independent runs that reuse a builder or comparator conversation. Invalidate any run with a
  non-empty isolation-manifest violation field. Stop immediately and move (not delete) any private
  artifact that appears under the eval-quality working tree.
